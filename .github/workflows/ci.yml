name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # CPU torch: the default Linux wheel drags in ~2.5 GB of CUDA libraries
      # that neither pyright nor the CPU suite touches.
      - run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --system -e ".[dev]"
      - run: pyright

  # The CPU suite in four parallel shards (a runner has 4 vCPUs; the suite is
  # ~330 CPU-seconds locally, a third of it the route tests).  The last shard
  # takes every directory the others don't name, so a new one is never skipped.
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "tests/server"
          - "tests/lens tests/units tests/sae tests/cli"
          - "tests/fit tests/session tests/model tests/browser tests/loom"
          - "tests --ignore=tests/server --ignore=tests/lens --ignore=tests/units --ignore=tests/sae --ignore=tests/cli --ignore=tests/fit --ignore=tests/session --ignore=tests/model --ignore=tests/browser --ignore=tests/loom"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --system -e ".[dev]"
      - run: pytest -q -m "not gpu" -n auto ${{ matrix.shard }}

  # The one check branch protection names.
  test:
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run check
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - name: Verify committed web bundle is current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- drowse/web/dist/)" ]; then
            git status --short --untracked-files=all -- drowse/web/dist/
            exit 1
          fi

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>drowse social card</title>
  <!-- The link card (public/social/drowse.png, 1200 x 630), as Ledger draws one (its DESIGN.md, "The marks
       and the cards"): a painting with the name set over it, and no mark tile. scripts/social-card.mjs
       paints it (scripts/paint/harbour.py: the harbour the reply describes, a lamp on the quay for each
       layer whose reflection is as long as one word reads calm there, and the last boat in, which is the
       mark) and hands it to draw() with scripts/social-card.json, the card's readings. The type is
       Ledger's card.css: the name; a steering term as the recipe bar draws it; and a reply with its words
       tinted by the probe the term steers, as the Page colours them. The readings are illustrative.
       Alt text: "The name drowse over a painted harbour at dusk, with the steering term 0.4 calm and a
       reply, the harbour goes quiet as the last boats come in, whose words are tinted by how calm the
       model reads them. A lamp on the quay for each of the model's layers lays a reflection as long as
       one word reads calm there, and a last boat comes in." -->
  <link rel="stylesheet" href="../node_modules/@stdlogits/ledger/src/styles/card.css">
  <style>
    /* The reading's depth: where the term's probe peaks, a little past the middle. The type keeps to
       the sky, above the quay. */
    body { --tint: color-mix(in oklch, var(--deep) 45%, var(--late)); }
    .card { justify-content: flex-start; gap: 34px; }
  </style>
</head>
<body>
  <img class="art" id="art" alt="">
  <main class="card">
    <div class="name">drowse</div>
    <div class="page">
      <span class="term"><span class="alpha" id="alpha"></span><span id="concept"></span></span>
      <p class="said" id="said"></p>
    </div>
  </main>
  <script>
    // art: the painting's URL. term and words: scripts/social-card.json, each word with its calm reading
    // (0 to 1, as the Page scales it to its strongest word), which sets how strongly it is tinted.
    window.draw = async ({ art, term, words }) => {
      document.getElementById("alpha").textContent = term.alpha;
      document.getElementById("concept").textContent = term.concept;
      const said = document.getElementById("said");
      words.forEach(([word, v], i) => {
        if (i) said.append(" ");
        const span = document.createElement("span");
        span.textContent = word;
        span.style.setProperty("--v", `${Math.round(v * 40)}%`);
        said.append(span);
      });
      const image = document.getElementById("art");
      image.src = art;
      await image.decode();
    };
  </script>
</body>
</html>
